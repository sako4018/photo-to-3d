<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>photo-to-3d installer</title>
<style>
  :root { --bg: #17171a; --fg: #ececef; --muted: #9a9aa3; --accent: #f2a65a; --track: #2a2a30; --bad: #ff7b72; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--fg);
    font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-user-select: none;
    display: flex; flex-direction: column; padding: 44px 32px 24px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .sub { margin: 0 0 22px; color: var(--muted); }
  .status { min-height: 18px; margin-bottom: 8px; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
  .bar.busy .fill { width: 30%; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
  .detail { margin-top: 8px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 16px; }
  .error { color: var(--bad); }
  .buttons { margin-top: auto; display: flex; justify-content: flex-end; gap: 8px; }
  button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid #3a3a42; background: #26262c; color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1208; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Install photo-to-3d</h1>
  <p class="sub">Turns one photo into a print-ready 3D model.</p>
  <div class="status" id="status">Ready to download.</div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="detail" id="detail"></div>
  <div class="buttons">
    <button id="cancel" hidden>Cancel</button>
    <button id="retry" hidden>Try again</button>
    <button id="quit" hidden>Close</button>
    <button id="open" class="primary" hidden>Open photo-to-3d</button>
    <button id="start" class="primary">Download and install</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
