name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (ruff and tests)
    # Apple Silicon runner. macos-14 is deprecated and goes away on 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --config pyproject.toml . ../scripts

      - name: Check formatting
        run: uv run ruff format --check --config pyproject.toml . ../scripts

      # The slow tests need the model weights (about 8 GB), so they only run locally.
      - name: Tests
        run: uv run pytest -m "not slow"

  app:
    name: app (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      # Lint, tests and build do not need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
